name: Template tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: cargo test (${{ matrix.template }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template:
          - templates/private_stable_coin/issuer
          - templates/private_stable_coin/issuer-no-user-badge
          - templates/private_stable_coin/issuer-minimal
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.template }}

      - name: Run tests
        working-directory: ${{ matrix.template }}
        run: cargo test --all-features --locked

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Check advisories
        working-directory: ${{ matrix.template }}
        run: cargo deny --locked --config "$GITHUB_WORKSPACE/deny.toml" check advisories

  app:
    name: cargo test (applications/stablecoin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Lint
        run: cargo clippy -p stablecoin --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test -p stablecoin --locked
